---
# shoggoth stack — observability. Persistent services pinned to halo node (archon).
# Global agents (node-exporter, cadvisor, promtail) run on every swarm node.
version: "3.7"

services:
  prometheus:
    image: prom/prometheus:v2.53.0
    networks:
      - traefik-public
    user: "1000"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--storage.tsdb.retention.size=10GB'
      - '--web.enable-lifecycle'
    volumes:
      - /media/observability/prometheus:/prometheus
      - /media/observability/prometheus-config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - /media/observability/prometheus-config/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.role == halo

  alertmanager:
    image: prom/alertmanager:v0.27.0
    networks:
      - traefik-public
    user: "1000"
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    volumes:
      - /media/observability/alertmanager:/alertmanager
      - /media/observability/alertmanager-config/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.role == halo

  grafana:
    image: grafana/grafana:11.1.0
    networks:
      - traefik-public
    user: "1000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD={{ lookup('community.general.onepassword', 'grafana-admin', field='password', vault='ansible') }}
      - GF_SERVER_ROOT_URL=https://grafana.services.jowj.net
      - GF_PATHS_PROVISIONING=/etc/grafana/provisioning
    volumes:
      - /media/observability/grafana:/var/lib/grafana
      - /media/observability/grafana-provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - /media/observability/grafana-provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.role == halo
      labels:
        - "traefik.enable=true"
        - "traefik.http.services.shoggoth-grafana.loadbalancer.server.port=3000"
        - "traefik.http.routers.shoggoth-grafana.rule=Host(`grafana.services.jowj.net`)"
        - "traefik.http.routers.shoggoth-grafana.entrypoints=websecure"
        - "traefik.http.routers.shoggoth-grafana.tls.certresolver=services-resolver"

  loki:
    image: grafana/loki:3.1.0
    networks:
      - traefik-public
    user: "1000"
    command:
      - '-config.file=/etc/loki/loki.yml'
    volumes:
      - /media/observability/loki:/loki
      - /media/observability/loki-config/loki.yml:/etc/loki/loki.yml:ro
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.role == halo

  node-exporter:
    image: prom/node-exporter:v1.8.1
    networks:
      - traefik-public
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    deploy:
      mode: global
      resources:
        limits:
          memory: 128M

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    networks:
      - traefik-public
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
    deploy:
      mode: global
      resources:
        limits:
          memory: 128M

  promtail:
    image: grafana/promtail:3.1.0
    networks:
      - traefik-public
    command:
      - '-config.file=/etc/promtail/promtail.yml'
    volumes:
      - /var/log:/var/log:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /media/observability/promtail-config/promtail.yml:/etc/promtail/promtail.yml:ro
    deploy:
      mode: global
      resources:
        limits:
          memory: 128M

networks:
  traefik-public:
    external: true
